version: 2

models:
  - name: stg_communes
    description: "Établissements SIRENE nettoyés issus du CSV brut. Une ligne par établissement (SIRET)."
    columns:
      - name: siret
        description: "Identifiant unique de l'établissement, 14 chiffres (SIREN + NIC)."
        tests:
          - not_null
          - unique

      - name: siren
        description: "Identifiant de l'entreprise à laquelle appartient l'établissement, 9 chiffres."
        tests:
          - not_null

      - name: nic
        description: "Numéro interne de classement qui distingue les établissements d'une même entreprise, 5 chiffres."
        tests:
          - not_null

      - name: code_commune
        description: "Code INSEE de la commune où est situé l'établissement, 5 caractères (ex: 44109 pour Nantes)."
        tests:
          - not_null

      - name: nom_commune
        description: "Nom de la commune de l'établissement tel qu'il figure dans la base SIRENE."
        tests:
          - not_null

      - name: code_postal
        description: "Code postal de l'établissement, 5 chiffres. Peut différer du code commune."

      - name: etat_administratif
        description: "État courant de l'établissement : Actif (ouvert) ou Fermé (cessé d'activité)."
        tests:
          - not_null
          - accepted_values:
              values: ['Actif', 'Fermé']

      - name: activite_principale
        description: "Code NAF de l'activité principale exercée par l'établissement (ex: 47.11F pour supermarchés)."

      - name: est_employeur
        description: "Indique si l'établissement a déclaré au moins un salarié : Oui ou Non. Null si non renseigné."
        tests:
          - accepted_values:
              values: ['Oui', 'Non']

      - name: date_creation
        description: "Date de création de l'établissement au format JJ/MM/AAAA."

      - name: date_fermeture
        description: "Date de fermeture de l'établissement au format JJ/MM/AAAA. Null si l'établissement est encore actif."

      - name: code_departement
        description: "Code INSEE du département de l'établissement, 2 chiffres (ex: 44 pour Loire-Atlantique)."
        tests:
          - not_null

      - name: nom_region
        description: "Nom de la région administrative de l'établissement (toujours Pays de la Loire dans ce dataset)."
        tests:
          - not_null

      - name: geolocalisation
        description: "Coordonnées GPS de l'établissement au format 'latitude, longitude'. Null si non géolocalisé."

      - name: categorie_entreprise
        description: "Taille de l'unité légale selon la loi LME : PME, ETI ou GE. Null pour les micro-entreprises non classées."
        tests:
          - accepted_values:
              values: ['PME', 'ETI', 'GE']

  - name: stg_emploi
    description: "Demandeurs d'emploi en fin de mois (DEFM) par commune, nettoyés depuis la source DARES. Une ligne par combinaison période / commune / sexe / tranche d'âge."
    columns:
      - name: periode
        description: "Trimestre de référence au format AAAA-TN (ex : 2024-T4)."
        tests:
          - not_null

      - name: code_commune
        description: "Code INSEE de la commune, 5 caractères."
        tests:
          - not_null

      - name: nom_commune
        description: "Nom de la commune."
        tests:
          - not_null

      - name: code_departement
        description: "Code INSEE du département, 2 caractères."
        tests:
          - not_null

      - name: nom_departement
        description: "Nom du département."

      - name: code_region
        description: "Code INSEE de la région."

      - name: nom_region
        description: "Nom de la région administrative."

      - name: sexe
        description: "Sexe des demandeurs : Total, Hommes ou Femmes."
        tests:
          - not_null
          - accepted_values:
              values: ['Total', 'Hommes', 'Femmes']

      - name: tranche_age
        description: "Tranche d'âge : Total, Moins de 25 ans, De 25 à 49 ans, 50 ans et plus."
        tests:
          - not_null
          - accepted_values:
              values: ['Total', 'Moins de 25 ans', 'De 25 à 49 ans', '50 ans et plus']

      - name: categorie_demande
        description: "Catégorie de demande d'emploi. Toujours ABC (catégories A, B et C cumulées)."

      - name: type_donnees
        description: "Mode de calcul de la série. Toujours Brutes (données non désaisonnalisées)."

      - name: nb_demandeurs_emploi
        description: "Nombre de demandeurs d'emploi inscrits en fin de mois."
        tests:
          - not_null
